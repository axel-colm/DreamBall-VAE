[project]
name = "dreamball"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "pymunk>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Projet sur une partition NTFS : tous les fichiers apparaissent exécutables (chmod sans effet)
ignore = ["EXE002"]
